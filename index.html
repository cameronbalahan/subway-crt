<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>subway-crt: NYC Subway Real-Time Tracker &amp; System Map (Amber Monochrome CRT)</title>
    <meta name="description" content="Autonomous retro-futuristic CRT departure board for Bedford Ave (L) paired with an animated schematic transit map of Manhattan and North Brooklyn in Amber Monochrome." />
    <meta property="og:title" content="subway-crt: NYC Subway Real-Time Tracker &amp; System Map" />
    <meta property="og:description" content="Autonomous retro-futuristic CRT departure board for Bedford Ave (L) paired with an animated schematic transit map of Manhattan and North Brooklyn in Amber Monochrome." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;700;800&family=VT323&display=swap" rel="stylesheet">
    <style>
      :root {
        --crt-amber: #FFB000;
        --crt-amber-dim: #805300;
        --crt-amber-bright: #FFE066;
        --crt-bg: #0C0802;
        --theme-color: #FFB000;
        --glow-color: rgba(255, 176, 0, 0.45);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #040301;
        color: var(--theme-color);
        font-family: 'Share Tech Mono', 'JetBrains Mono', monospace;
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      .crt-bezel {
        flex: 1;
        position: relative;
        margin: 8px 10px 4px 10px;
        border: 5px solid #2B1D05;
        border-radius: 12px;
        background: var(--crt-bg);
        box-shadow: 
          inset 0 0 100px rgba(0, 0, 0, 0.95),
          0 0 0 1px #4A320A,
          0 0 35px rgba(255, 176, 0, 0.2),
          0 0 15px rgba(255, 150, 0, 0.15);
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .crt-scanlines {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(rgba(18, 12, 2, 0) 50%, rgba(0, 0, 0, 0.45) 50%),
                    linear-gradient(90deg, rgba(255, 176, 0, 0.02), rgba(0, 0, 0, 0), rgba(255, 176, 0, 0.02));
        background-size: 100% 3px, 6px 100%;
        pointer-events: none;
        z-index: 40;
        opacity: 0.88;
      }
      .crt-vignette {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: radial-gradient(circle at center, transparent 65%, rgba(6, 4, 1, 0.85) 100%);
        pointer-events: none;
        z-index: 41;
      }
      .crt-glare {
        position: absolute;
        top: 0; left: 0; right: 0; height: 35%;
        background: linear-gradient(180deg, rgba(255, 200, 100, 0.03) 0%, rgba(255, 200, 100, 0) 100%);
        pointer-events: none;
        z-index: 42;
      }
      #terminal-display {
        flex: 1;
        padding: 12px 18px;
        font-size: 12.8px;
        line-height: 1.25;
        white-space: pre;
        overflow: auto;
        text-shadow: 0 0 5px var(--glow-color), 0 0 10px var(--glow-color);
        font-weight: 600;
        z-index: 10;
      }
      .crt-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 16px;
        background: #0C0802;
        border-top: 1px solid rgba(255, 176, 0, 0.25);
        font-size: 11.5px;
        z-index: 50;
      }
      .btn {
        background: #1A1104;
        color: #C28915;
        border: 1px solid #4D3409;
        padding: 4px 12px;
        border-radius: 4px;
        font-family: inherit;
        font-size: 11px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.15s ease;
        letter-spacing: 0.5px;
      }
      .btn:hover {
        background: #2E1E05;
        color: #FFE066;
        border-color: var(--crt-amber);
        box-shadow: 0 0 10px rgba(255, 176, 0, 0.35);
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #FFB000;
        box-shadow: 0 0 8px #FFB000;
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
    </style>
  </head>
  <body>
    <div class="crt-bezel">
      <div class="crt-glare"></div>
      <div class="crt-scanlines" id="scanlines-layer"></div>
      <div class="crt-vignette"></div>
      <pre id="terminal-display">INITIALIZING SUBWAY-CRT (AMBER MONOCHROME P3 RADAR)...</pre>
    </div>

    <div class="crt-footer">
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn" onclick="toggleScanlines()">SCANLINES: ON</button>
        <button class="btn" onclick="toggleFullscreen()">⛶ 1080p FULLSCREEN</button>
      </div>

      <div style="display:flex; gap:10px; align-items:center;">
        <span style="color:#A67200; font-size:11px;">BEDFORD AV (L) PASSENGER RADAR</span>
        <span class="live-dot" title="Live MTA GTFS-RT Active"></span>
      </div>
    </div>

    <script>
      const term = document.getElementById('terminal-display');
      const scanlines = document.getElementById('scanlines-layer');

      let scanlinesEnabled = true;
      function toggleScanlines() {
        scanlinesEnabled = !scanlinesEnabled;
        scanlines.style.display = scanlinesEnabled ? 'block' : 'none';
        event.target.textContent = 'SCANLINES: ' + (scanlinesEnabled ? 'ON' : 'OFF');
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      function ansiToHtml(text) {
        if (!text) return '';
        let s = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        const ansiRegex = /\x1b\[([0-9;]*)m/g;
        let html = '';
        let lastIndex = 0;
        let activeSpans = 0;

        let match;
        while ((match = ansiRegex.exec(s)) !== null) {
          html += s.substring(lastIndex, match.index);
          lastIndex = match.index + match[0].length;

          const codes = match[1] ? match[1].split(';').map(Number) : [0];

          if (codes[0] === 0 || match[1] === '') {
            while (activeSpans > 0) {
              html += '</span>';
              activeSpans--;
            }
          } else {
            let style = '';
            let i = 0;
            while (i < codes.length) {
              const c = codes[i];
              if (c === 1) {
                style += 'font-weight:800;';
                i++;
              } else if (c === 38 && codes[i+1] === 2) {
                const r = codes[i+2], g = codes[i+3], b = codes[i+4];
                style += 'color:rgb(' + r + ',' + g + ',' + b + ');';
                i += 5;
              } else if (c === 48 && codes[i+1] === 2) {
                const r = codes[i+2], g = codes[i+3], b = codes[i+4];
                style += 'background-color:rgb(' + r + ',' + g + ',' + b + ');';
                i += 5;
              } else if (c >= 30 && c <= 37) {
                const stdColors = ['#000','#c00','#0c0','#c60','#00c','#c0c','#0cc','#ccc'];
                style += 'color:' + stdColors[c-30] + ';';
                i++;
              } else if (c >= 40 && c <= 47) {
                const stdBg = ['#000','#c00','#0c0','#c60','#00c','#c0c','#0cc','#ccc'];
                style += 'background-color:' + stdBg[c-40] + ';';
                i++;
              } else {
                i++;
              }
            }
            if (style) {
              html += '<span style="' + style + '">';
              activeSpans++;
            }
          }
        }

        html += s.substring(lastIndex);
        while (activeSpans > 0) {
          html += '</span>';
          activeSpans--;
        }
        return html;
      }

      let eventSource;
      function connectStream() {
        eventSource = new EventSource('/stream');
        eventSource.onmessage = function(e) {
          try {
            const raw = JSON.parse(e.data);
            term.innerHTML = ansiToHtml(raw);
          } catch {
            term.innerHTML = ansiToHtml(e.data);
          }
        };
        eventSource.onerror = function() {
          eventSource.close();
          setTimeout(connectStream, 1500);
        };
      }

      connectStream();
    </script>
  </body>
</html>
